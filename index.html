// 型を定義
type GreetingProps = {
  name: string;
};

// 子コンポーネント：props を受け取る
function Greeting(props: GreetingProps) {
  return <h1>こんにちは、{props.name}さん！</h1>;
}

// 親コンポーネント：props を渡す
function App() {
  return (
    <div>
      <Greeting name="田中" />
      <Greeting name="鈴木" />
      <Greeting name="佐藤" />
    </div>
  );
}
